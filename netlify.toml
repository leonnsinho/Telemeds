[build]
  # Comando que o Netlify executará para fazer o build
  command = "npm run build"
  
  # Diretório que será publicado (onde estão os arquivos buildados)
  publish = "dist"
  
  # Configurações de redirecionamento para SPA (Single Page Application)
  [[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

[build.environment]
  # Versão do Node.js (opcional, mas recomendado)
  NODE_VERSION = "18"

# Configurações de headers básicas sem forçar compressão
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers específicos para arquivos CSS sem conflito de compressão
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers específicos para arquivos JS sem conflito de compressão
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para imagens SVG
[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

# Headers para o HTML principal sem preload que causa warnings
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
