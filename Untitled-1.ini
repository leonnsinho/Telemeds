4. Mapeamento de Referências na Página (Onde alterar)
4.1 Cabeçalho / HERO (Primeira dobra)
Onde aparece: - Título principal (H1) - Texto de apoio abaixo do título
Texto atual identificado:
“Cuidado especializado para sua saúde mental”
“Atendimento psiquiátrico online com médicos especializados, diagnóstico preciso e
tratamento personalizado...”
Termos sensíveis: - Saúde mental - Psiquiátrico - Diagnóstico - Tratamento
Sugestão de alteração (recomendado):
H1 sugerido (mais seguro):
Cuidado especializado para o seu bem-estar emocional
Texto de apoio sugerido:
Atendimento online com especialista em saúde emocional, com foco em avaliação clínica,
orientação profissional e acompanhamento contínuo.
4.2 Seção: “Casos que atendemos” (CRÍTICA)
Onde aparece: Cards de condições/temas atendidos.
Cards sensíveis identificados na página: - Depressão e Transtornos do Humor - Ansiedade e
Transtornos Ansiosos - Transtornos do Sono - TDAH (Transtorno de Déficit de Atenção) - Dependência
Química - Transtornos Alimentares - Transtorno Bipolar - Estresse e Burnout
Problema: A menção direta a transtornos psiquiátricos caracteriza conteúdo de saúde sensível e pode
aumentar reprovações e limitações de campanha.
Ação recomendada: Substituir os cards por uma abordagem de temas de cuidado, evitando nomes de
transtornos.
Modelo seguro para substituir os cards:
Título sugerido:
Acompanhamento em Saúde Emocional
Descrição sugerida:
2
Suporte profissional para bem-estar, equilíbrio emocional e acompanhamento contínuo
conforme cada caso.
Sugestões de trocas específicas (opcional): - “Dependência Química” → Suporte Comportamental
(ou remover da LP de tráfego) - “TDAH” → Foco e Desempenho Cognitivo - “Depressão / Ansiedade /
Bipolar” → Equilíbrio emocional e rotina
4.3 Seção: “Resultados que comprovam nossa excelência”
Onde aparece: Cards com números (taxa de melhora, pacientes atendidos, horários).
Risco: Baixo. Não há termos sensíveis diretos.
Sugestão: Manter.
4.4 Seção: “Nosso Especialista”
Onde aparece: Bloco de apresentação do profissional.
Texto atual identificado: - “Dr. Rennan Hollen” - “Psiquiatra” - “CRM”
Risco: - “Psiquiatra” reforça a especialidade sensível. - “CRM” não reprova isoladamente, mas
recomenda-se não utilizar como argumento de venda.
Sugestão de alteração (recomendado):
Título profissional sugerido:
Especialista em Saúde Mental
Sugestão adicional: - Manter CRM de forma discreta (rodapé ou texto pequeno) - Evitar textos com
promessas clínicas diretas
4.5 Seção: “Como funciona a consulta online”
Onde aparece: Passos 1, 2 e 3.
Ponto crítico: Passo 3
Texto atual identificado (padrão de risco):
“3. Receba” “Plano personalizado com receitas, orientações e acompanhamento...”
Termos sensíveis: - Receitas - Prescrição
Ação obrigatória: Remover qualquer menção a “receita/prescrição” na landing page de tráfego pago.
