RELATÓRIO PSIQUIATRIA – GOOGLE ADS
TeleMeds | Página: Psiquiatria
1. Objetivo do Relatório
Este documento tem como objetivo orientar o desenvolvedor web na adequação da página
“Psiquiatria” da TeleMeds às políticas de Healthcare & Medicines do Google Ads.
A página atual contém termos sensíveis relacionados a saúde mental, transtornos psiquiátricos e
medicamentos/prescrições, que podem acionar bloqueios automáticos, revisões manuais e restrições
severas de anúncios no Google Ads.
O foco deste relatório é eliminar palavras-chave de alto risco, substituindo-as por linguagem
institucional segura, sem prejuízo da comunicação com o paciente.
2. Como o Google Ads avalia a página
O Google Ads utiliza sistemas automatizados que analisam:
• 
• 
• 
O texto do anúncio
O conteúdo completo da página de destino
O contexto semântico do domínio
⚠
️ Importante: o Google 
não interpreta contexto médico, apenas palavras-chave sensíveis. A
simples presença de determinados termos pode gerar reprovação automática.
